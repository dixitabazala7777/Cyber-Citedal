# DeepShield-Core Layer 0 Nginx Perimeter Shield
# Production-Hardened Gateway Configuration

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging formats with mTLS headers
    log_format gateway_log '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" ssl_verify="$ssl_client_verify" '
                          'client_sha256="$http_x_client_cert_sha256"';

    access_log /var/log/nginx/access.log gateway_log;

    # Performance & Optimization Settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # --- SECURITY HARDENING ---

    # Hide Nginx version number
    server_tokens off;

    # Max body size capped at 50KB to eliminate memory exhaustion vectors
    client_max_body_size 50k;
    client_body_buffer_size 50k;

    # Aggressive timeout windows for header and body processing
    client_header_timeout 5s;
    client_body_timeout 5s;
    send_timeout 5s;

    # Slowloris and concurrent request mitigation
    # Define zone for connection limiting (limit to 5 concurrent sockets per client IP)
    limit_conn_zone $binary_remote_addr zone=slow_limit:10m;
    # Define zone for request rate limiting
    limit_req_zone $binary_remote_addr zone=req_limit:10m rate=10r/s;

    # Upstream air-gapped AI pipeline application
    upstream deepshield_backend {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    server {
        listen 443 ssl http2;
        server_name gateway.deepshield.internal;

        # TLS Configurations (Enforce TLS 1.3 only)
        ssl_protocols TLSv1.3;
        ssl_prefer_server_ciphers off;

        # Server Certificate and Key
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # --- Layer 1 mTLS Certificate Verification ---
        ssl_client_certificate /etc/nginx/certs/ca.crt;
        ssl_verify_client optional_no_ca; # Managed in FastAPI, but inspected at proxy
        ssl_verify_depth 2;

        # Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        location / {
            # Apply concurrent connection limit (Max 5 concurrent connections)
            limit_conn slow_limit 5;
            # Apply request rate limit (10 req/sec, burst allowance 5 with nodelay)
            limit_req zone=req_limit burst=5 nodelay;

            # Forwarding headers to FastAPI application
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # --- Forwarding client hardware certificate verification metadata ---
            proxy_set_header X-Client-Verify $ssl_client_verify;
            proxy_set_header X-Client-DN $ssl_client_s_dn;
            proxy_set_header X-Client-Cert-SHA256 $ssl_client_fingerprint;

            # Proxy performance tuning
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            proxy_send_timeout 10s;

            # Proxy destination
            proxy_pass http://deepshield_backend;
        }

        # Catch-all rule for security sanitization
        error_page 400 401 403 404 /error.json;
        location = /error.json {
            default_type application/json;
            return 403 '{"error": "Access Denied", "code": "GATEWAY_PERIMETER_REJECTION"}';
        }
    }
}
